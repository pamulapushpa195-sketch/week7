<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML</title>
</head>
<body>
    <script>
        let a = 10;
        let b = 20;
        let sum= a+b;
        document.write("Sum=",sum,"<br>");
        let mul = a*b;
        document.write("product",mul,"<br>");
        let sub = a-b;
        document.write("subtraction",sub,"<br>");
        let div = a/b;
        document.write("division",div,"<br>");
     </script>
</body>
</html>
